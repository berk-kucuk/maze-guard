[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-guard"
version = "2.20.2"
description = "Maze Guard — Public WiFi güvenlik aracı: MITM tespiti, firewall otomasyonu"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "httpx>=0.27.0",
    "PyQt6>=6.6.0",
    "qasync>=0.27.0",
    "cryptography>=42.0.0",
]

[project.scripts]
maze-guard = "maze.gui.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["maze*"]

[tool.setuptools.package-data]
"maze.gui" = ["assets/*.svg", "logo/*.png", "logo/*.svg"]
