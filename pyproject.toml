[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "maze-guard"
version = "0.1.0"
description = "Maze Guard — Public WiFi güvenlik aracı: MITM tespiti, MAC randomization, firewall otomasyonu"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "httpx>=0.27.0",
    "PyQt6>=6.6.0",
    "qasync>=0.27.0",
]

[project.scripts]
maze-guard = "maze.gui.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["maze*"]
